version: '3.8'

services:
  body-sim-backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./uploads:/app/uploads
      - ./temp:/app/temp
    environment:
      - MODEL_PATH=models/bmnet.pth
      - DEVICE=auto
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3